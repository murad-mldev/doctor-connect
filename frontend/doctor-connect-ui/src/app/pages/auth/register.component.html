<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Create Your Account</h2>
      <p>
        Already have an account?
        <a routerLink="/login" class="link">Sign in</a>
      </p>
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="success-message">
        {{ successMessage }}
      </div>

      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input
          id="fullName"
          name="fullName"
          type="text"
          required
          [(ngModel)]="fullName"
          placeholder="Enter your full name"
          class="form-input"
        />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          required
          [(ngModel)]="email"
          placeholder="Enter your email"
          class="form-input"
        />
      </div>

      <div class="form-group">
        <label for="phone">Phone</label>
        <input
          id="phone"
          name="phone"
          type="tel"
          required
          [(ngModel)]="phone"
          placeholder="Enter your phone number"
          class="form-input"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          [(ngModel)]="password"
          placeholder="Create a password"
          class="form-input"
        />
      </div>

      <div class="form-group">
        <label for="role">Register as</label>
        <select
          id="role"
          name="role"
          required
          [(ngModel)]="role"
          class="form-input"
        >
          <option value="ROLE_PATIENT">Patient</option>
          <option value="ROLE_DOCTOR">Doctor</option>
        </select>
      </div>

      <!-- Doctor License Number - shown only when Doctor is selected -->
      <div class="form-group" *ngIf="role === 'ROLE_DOCTOR'">
        <label for="licenseNumber">Medical License Number *</label>
        <input
          id="licenseNumber"
          name="licenseNumber"
          type="text"
          [required]="role === 'ROLE_DOCTOR'"
          [(ngModel)]="licenseNumber"
          placeholder="Enter your medical license number"
          class="form-input"
        />
        <small class="form-hint">This will be verified by admin before approval</small>
      </div>

      <button type="submit" [disabled]="loading" class="btn-primary btn-full">
        <span *ngIf="!loading">Register</span>
        <span *ngIf="loading">Creating account...</span>
      </button>
    </form>
  </div>
</div>

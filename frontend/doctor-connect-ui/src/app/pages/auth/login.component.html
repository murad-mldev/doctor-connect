<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Sign In to DoctorConnect</h2>
      <p>
        Or
        <a routerLink="/register" class="link">create a new account</a>
      </p>
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <div class="form-group">
        <label for="emailOrPhone">Email or Phone</label>
        <input
          id="emailOrPhone"
          name="emailOrPhone"
          type="text"
          required
          [(ngModel)]="credentials.emailOrPhoneNumber"
          placeholder="Enter your email or phone number"
          class="form-input"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          [(ngModel)]="credentials.password"
          placeholder="Enter your password"
          class="form-input"
        />
      </div>

      <button type="submit" [disabled]="loading" class="btn-primary btn-full">
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading">Signing In...</span>
      </button>

      <div class="auth-footer">
        <a routerLink="/admin/login" class="link-secondary">Admin Login</a>
      </div>
    </form>
  </div>
</div>

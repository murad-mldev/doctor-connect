<div class="doctor-card">
  <div class="card-content">
    <div class="doctor-header">
      <div class="doctor-avatar-gradient">
        {{ doctor.user?.fullName?.charAt(0) || 'D' }}
      </div>
      <div class="doctor-name-section">
        <h3>Dr. {{ doctor.user?.fullName }}</h3>
        <p class="specialty">{{ doctor.specialization }}</p>
        <div *ngIf="doctor.user?.isVerified" class="verified-badge">
          <svg fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
          </svg>
          <span>Verified</span>
        </div>
      </div>
    </div>

    <div class="doctor-details">
      <div *ngIf="doctor.department" class="detail-row">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
        </svg>
        <span>{{ doctor.department.name }}</span>
      </div>
      <div class="detail-row">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span>Location not specified</span>
      </div>
      <div class="detail-row">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
        <span>Experience details</span>
      </div>
      <div class="detail-row fee-row">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>Consultation fee available</span>
      </div>
    </div>

    <div *ngIf="doctor.qualifications" class="qualifications-box">
      <p class="qualifications-label">Qualifications:</p>
      <p class="qualifications-text">{{ doctor.qualifications }}</p>
    </div>

    <div class="card-actions">
      <button [routerLink]="['/patient/book-appointment', doctor.id]" class="btn-book">
        Book Appointment
      </button>
      <button [routerLink]="['/doctor-profile', doctor.id]" class="btn-view">
        View Profile
      </button>
    </div>
  </div>
</div>

<div class="video-room-container">
  <!-- Loading State -->
  <div *ngIf="loading" class="video-loading">
    <div class="spinner-white"></div>
    <p>Loading video room...</p>
  </div>

  <!-- Video Room -->
  <div *ngIf="!loading && videoRoom" class="video-room">
    <!-- Header -->
    <div class="video-header">
      <div class="header-info">
        <h1>Video Consultation</h1>
        <span class="status-badge">Active</span>
      </div>
      <div class="header-actions">
        <span class="meeting-code">Meeting Code: {{ videoRoom.meetingCode }}</span>
        <button (click)="copyMeetingLink()" class="btn-copy">
          Copy Link
        </button>
        <button (click)="endConsultation()" class="btn-end">
          End Call
        </button>
      </div>
    </div>

    <!-- Video Content -->
    <div class="video-content">
      <div class="video-wrapper">
        <iframe
          [src]="sanitizedMeetUrl"
          class="video-iframe"
          allow="camera; microphone; fullscreen; speaker; display-capture">
        </iframe>
      </div>

      <!-- Controls -->
      <div class="video-controls">
        <button
          (click)="toggleMicrophone()"
          [class.control-inactive]="!isMicOn"
          [class.control-active]="isMicOn"
          class="control-btn">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
          </svg>
        </button>
        <button
          (click)="toggleCamera()"
          [class.control-inactive]="!isCameraOn"
          [class.control-active]="isCameraOn"
          class="control-btn">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
          </svg>
        </button>
        <button
          (click)="toggleScreenShare()"
          [class.control-sharing]="isScreenSharing"
          [class.control-active]="!isScreenSharing"
          class="control-btn">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="errorMessage" class="video-error">
    <div class="error-message">{{ errorMessage }}</div>
    <button (click)="goBack()" class="btn-back">
      Go Back
    </button>
  </div>
</div>

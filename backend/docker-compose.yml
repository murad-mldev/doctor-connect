services:
  postgres:
    image: postgres:latest
    container_name: doctor-connect-postgres
    environment:
      POSTGRES_DB: doctor_connect
      POSTGRES_USER: root
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - doctor-connect-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: doctor-connect-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: murad@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - doctor-connect-network
    restart: unless-stopped
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local

networks:
  doctor-connect-network:
    driver: bridge

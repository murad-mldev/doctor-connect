<div class="file-upload-container">
  <div
    class="drop-zone"
    [class.dragging]="isDragging"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <lucide-icon [img]="Upload" [size]="48"></lucide-icon>
    <h3>{{ label }}</h3>
    <p>Drag and drop files here or click to browse</p>
    <input
      type="file"
      [accept]="accept"
      [multiple]="multiple"
      (change)="onFileSelect($event)"
      class="file-input"
      #fileInput
    />
    <button class="btn-browse" (click)="fileInput.click()">
      Browse Files
    </button>
    <p class="file-info">Maximum file size: {{ maxSizeMB }}MB</p>
  </div>

  <div class="selected-files" *ngIf="selectedFiles.length > 0">
    <h4>Selected Files ({{ selectedFiles.length }})</h4>
    <div class="file-list">
      <div class="file-item" *ngFor="let file of selectedFiles; let i = index">
        <lucide-icon [img]="File" [size]="20"></lucide-icon>
        <div class="file-details">
          <span class="file-name">{{ file.name }}</span>
          <span class="file-size">{{ getFileSize(file.size) }}</span>
        </div>
        <button class="btn-remove" (click)="removeFile(i)" title="Remove file">
          <lucide-icon [img]="X" [size]="18"></lucide-icon>
        </button>
      </div>
    </div>
    <button class="btn-clear" (click)="clearFiles()">Clear All</button>
  </div>
</div>

<div class="appointment-card">
  <div class="card-header">
    <div class="user-info">
      <div class="user-avatar">
        {{ getInitial() }}
      </div>
      <div class="user-details">
        <h3>
          {{ isDoctor ? appointment.patient?.user?.fullName : 'Dr. ' + appointment.doctor?.user?.fullName }}
        </h3>
        <p>{{ appointment.doctor?.specialization }}</p>
      </div>
    </div>
    <span [ngClass]="getStatusClass()" class="status-badge">
      {{ appointment.status }}
    </span>
  </div>

  <div class="card-body">
    <div class="info-item">
      <svg class="info-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
      {{ appointment.appointmentTime | date: 'medium' }}
    </div>
    <div *ngIf="appointment.reason" class="info-item">
      <svg class="info-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
      {{ appointment.reason }}
    </div>
    <div class="info-item">
      <svg class="info-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      Fee: ৳{{ appointment.fee }}
    </div>
  </div>

  <div class="card-actions">
    <button
      *ngIf="showViewDetails"
      (click)="viewDetails.emit(appointment)"
      class="btn-action btn-details">
      View Details
    </button>
    <button
      *ngIf="showJoinVideo && canJoinVideo()"
      [routerLink]="['/video-consultation', appointment.id]"
      class="btn-action btn-video">
      Join Video Call
    </button>
    <button
      *ngIf="showPrescription"
      (click)="viewPrescription.emit(appointment)"
      class="btn-action btn-prescription">
      View Prescription
    </button>
    <button
      *ngIf="showCancel && canCancel()"
      (click)="cancel.emit(appointment)"
      class="btn-action btn-cancel">
      Cancel
    </button>
    <button
      *ngIf="showReschedule && canReschedule()"
      (click)="reschedule.emit(appointment)"
      class="btn-action btn-reschedule">
      Reschedule
    </button>
    <button
      *ngIf="showComplete && canComplete()"
      (click)="complete.emit(appointment)"
      class="btn-action btn-complete">
      Mark Complete
    </button>
  </div>
</div>
